name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docsassistant
          POSTGRES_USER: docsassistant
          POSTGRES_PASSWORD: docsassistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsassistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256-jwt
      DB_NAME: docsassistant
      DB_USER: docsassistant
      DB_PASSWORD: docsassistant
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - name: Check migrations are up to date with models
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run build
