services:
  db:
    # PostgreSQL with the pgvector extension for similarity search
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && gunicorn main:app --worker-class uvicorn_worker.UvicornWorker --workers 2 --bind 0.0.0.0:8000"
    env_file: .env
    environment: &backend-env
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /data/media
      EMBEDDING_CACHE_DIR: /data/models
    volumes:
      - app_data:/data
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq worker.WorkerSettings
    env_file: .env
    environment: *backend-env
    # The worker reads uploads saved by the backend and keeps the downloaded embedding model
    volumes:
      - app_data:/data
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      # Read by the browser, so this is the address as seen from your machine
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8003/api/v1/
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_data:
